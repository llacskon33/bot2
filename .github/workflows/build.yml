name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Descomprimir proyecto
        run: unzip -o CoachBrawl-proyecto-android.zip

      - name: Compilar APK
        run: |
          cd CoachBrawl
          gradle assembleDebug

      - name: Subir APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: CoachBrawl-APK
          path: CoachBrawl/app/build/outputs/apk/debug/app-debug.apk
